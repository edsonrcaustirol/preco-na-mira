if(!p){document.getElementById('app').innerHTML='<section class="section"><div class="container"><div class="notice">Produto não encontrado.</div></div></section>'}else{PNMRegisterView(p.id);document.title=p.nome+' — Preço na Mira';if(p.tipoProduto==='gamer')document.body.classList.add('gamer-theme');if(p.tipoProduto==='casa')document.body.classList.add('house-theme');if(p.tipoProduto==='cozinha')document.body.classList.add('kitchen-theme');if(p.tipoProduto==='lavanderia')document.body.classList.add('laundry-theme');if(p.tipoProduto==='acessorio')document.body.classList.add('accessory-theme');if(p.tipoProduto==='obra')document.body.classList.add('build-theme');if(p.tipoProduto==='instalacao')document.body.classList.add('install-theme');if(p.tipoProduto==='acabamento')document.body.classList.add('finish-theme');const R={fone:['fones-de-ouvido.html','comparativo-fones.html','fones'],soundbar:['soundbars.html','comparativo-soundbars.html','soundbars'],smartwatch:['smartwatches.html','comparativo-smartwatches.html','smartwatches'],tv:['tvs.html','comparativo-tvs.html','TVs'],smartphone:['smartphones.html','comparativo-smartphones.html','smartphones'],notebook:['notebooks.html','comparativo-notebooks.html','notebooks'],monitor:['monitores.html','comparativo-monitores.html','monitores'],tablet:['tablets.html','comparativo-tablets.html','tablets'],internet:['internet.html','comparativo-internet.html','internet'],projetor:['projetores.html','comparativo-projetores.html','projetores'],casa:['casa-inteligente.html?tipo='+(p.subtipoCasa||'todos'),'comparativo-casa.html?tipo='+(p.subtipoCasa||'robot'),'Casa Inteligente'],cozinha:['cozinha.html?tipo='+(p.subtipoCozinha||'todos'),'comparativo-cozinha.html?tipo='+(p.subtipoCozinha||'airfryer'),'Cozinha'],lavanderia:['lavanderia.html?tipo='+(p.subtipoLavanderia||'compacta'),'lavanderia.html?tipo='+(p.subtipoLavanderia||'compacta'),'Lavanderia'],acessorio:['acessorios-tech.html?tipo='+(p.subtipoAcessorio||'todos'),'comparativo-acess ener noreferrer">Ver fonte ↗</a>`:''}</div><p class="official-image-note">${esc(p.imagemNota||'Imagem de referência. Confirme cor e variante na oferta.')}</p>`:p.imagemTipo==='anuncio'?'<span>Foto de referência do produto</span>':'<span>Imagem ilustrativa</span>'}</div><div class="product-detail-copy"><div class="eyeline">${esc(p.marca)} • ${esc(p.categoria)}</div><h1>${esc(p.nome)}</h1><p class="lead">${esc(p.chamada||p.resumo)}</p><div class="spec-pills">${(p.chips||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="data-quality ${dq.kind}"><div class="dq-icon">${dq.icon}</div><div><strong>${dq.label}</strong><br>${dq.text}</div></div>${offers(p)}<div class="product-utility-row"><button id="fav">♡ FAVORITAR</button><button id="list">＋ MINHA LISTA</button><button id="share">🔗 COMPARTILHAR</button></div><div class="affiliate-note">Link de afiliado: podemos receber comissão sem custo adicional para você.</div></div></div></div></section><section class="section"><div class="container"><div class="detail-grid"><article class="content-card"><h2>Para quem faz sentido?</h2><p>${esc(p.paraQuem)}</p><h2>Pontos que chamam atenção</h2><ul>${(p.pontos||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Ficha técnica</h2><div class="spec-table">${Object.entries(p.especificacoes||{}).map(([k,v])=>`<div><strong>${esc(k)}</strong><span>${esc(v)}</span></div>`).join('')}</div><h2>Nossa leitura</h2><p>${esc(p.veredito)}</p><div class="notice"><strong>Antes de comprar:</strong> ${esc(p.atencao)}</div></article><aside class="side-card"><h3>Resumo rápido</h3><div class="side-list"><div class="side-item"><strong>Marca</strong>${esc(p.marca)}</div><div class="side-item"><strong>Categoria</strong>${esc(p.categoria)}</div><div class="side-item"><strong>Loja</strong>${esc(p.loja||'Loja parceira')}</div></div>${offers(p)}<div class="product-compare-box"><strong>⚖️ Compare antes de decidir</strong><p>O comparador usa a régua da categoria deste produto.</p><button id="productCompare">ADICIONAR AO COMPARATIVO</button><a class="link" style="display:block;margin-top:12px" href="${comp}">Abrir comparador →</a></div>${p.fonteTecnica?`<a class="source-link" href="${esc(p.fonteTecnica)}" target="_blank" rel="noopener noreferrer">Fonte técnica: ${esc(p.fonteNome||'fabricante')} →</a>`:''}</aside></div>${comps.length?`<div class="related-block"><div class="section-head"><div><h2>✨ O que combina com isso?</h2><p>Produtos complementares já existentes no catálogo.</p></div></div><div class="related-grid">${comps.map(x=>mini(x,'comp')).join('')}</div></div>`:''}${alts.length?`<div class="related-block"><div class="section-head"><div><h2>🔄 Alternativas parecidas</h2><p>Mesma categoria e régua de comparação.</p></div></div><div class="related-grid">${alts.map(x=>mini(x,'alt')).join('')}</div></div>`:''}</div></section>`;document.getElementById('sticky').innerHTML=`<a href="${esc(p.linkAfiliado)}" target="_blank" rel="sponsored nofollow noopener noreferrer">VER PREÇO ATUAL →</a>`;const cb=document.getElementById('productCompare');function syncC(){const on=manager.has(p.id);cb.classList.toggle('selected',on);cb.textContent=on?'✓ ADICIONADO — ABRIR COMPARADOR':'ADICIONAR AO COMPARATIVO'}syncC();cb.onclick=()=>{if(manager.has(p.id))return location.href=comp;const ok=manager.add(p.id);if(!ok){alert('Você já escolheu 4 produtos.');return location.href=comp}syncC()};const fb=document.getElementById('fav'),lb=document.getElementById('list');function syncU(){fb.classList.toggle('active',PNMFavorites.has(p.id));fb.textContent=PNMFavorites.has(p.id)?'♥ NOS FAVORITOS':'♡ FAVORITAR';lb.classList.toggle('active',PNMList.has(p.id));lb.textContent=PNMList.has(p.id)?'✓ NA MINHA LISTA':'＋ MINHA LISTA'}syncU();fb.onclick=()=>{PNMFavorites.toggle(p.id);syncU()};lb.onclick=()=>{PNMList.toggle(p.id);syncU()};document.getElementById('share').onclick=async e=>{await PNMShare(location.href,p.nome+' — Preço na Mira');e.target.textContent='✓ LINK COPIADO';setTimeout(()=>e.target.textContent='🔗 COMPARTILHAR',1800)};document.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{manager.clear();manager.add(p.id);manager.add(b.dataset.compare);location.href=comp});syncU()}document.getElementById('menu').onclick=()=>document.getElementById('nav').classList.toggle('open');
