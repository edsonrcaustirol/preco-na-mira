name: O3 New Product Transaction

on:
  workflow_dispatch:
    inputs:
      transaction_id:
        description: Transaction identifier generated by the protected Central
        required: true
        type: string
      payload_b64:
        description: Base64 encoded validated product payload
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: o3-new-product-${{ inputs.transaction_id }}
  cancel-in-progress: false

jobs:
  transact:
    runs-on: ubuntu-latest
    env:
      TRANSACTION_ID: ${{ inputs.transaction_id }}
      PAYLOAD_B64: ${{ inputs.payload_b64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar main com histórico
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar ferramentas travadas
        run: npm ci

      - name: Validar identidade transacional
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSACTION_ID" =~ ^np-[a-f0-9]{24}$ ]]
          BRANCH="central/new-product-${TRANSACTION_ID}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch transacional já existe; recusando sobrescrita."
            exit 1
          fi
          echo "O3_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      - name: Preparar alteração local
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$O3_BRANCH"
          node scripts/o3-new-product-transaction.mjs --payload-b64 "$PAYLOAD_B64"

      - name: Restringir diff ao produto e derivados E2
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_ID="$(node -e "const p=JSON.parse(Buffer.from(process.env.PAYLOAD_B64,'base64').toString('utf8')); process.stdout.write(String(p.id||''))")"
          [[ "$PRODUCT_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          EXPECTED_PAGE="produto-${PRODUCT_ID}.html"

          # O sincronizador completo pode detectar drift de metadados em páginas antigas.
          # Uma transação de novo produto não deve carregar essas correções históricas.
          # Reverte somente páginas de produto já versionadas e preserva o novo produto.
          mapfile -t PREPARED < <(git status --porcelain | sed -E 's/^.. //')
          for file in "${PREPARED[@]}"; do
            if [[ "$file" == produto-*.html && "$file" != "$EXPECTED_PAGE" ]] && git ls-files --error-unmatch -- "$file" >/dev/null 2>&1; then
              echo "Drift legado isolado da transação O3: $file"
              git restore --worktree -- "$file"
            fi
          done

          mapfile -t FILES < <(git status --porcelain | sed -E 's/^.. //')
          test "${#FILES[@]}" -gt 0
          echo "Arquivos preparados pelo executor O3:"
          printf ' - %s\n' "${FILES[@]}"
          for file in "${FILES[@]}"; do
            case "$file" in
              data/produtos-index.js|data/produtos-mobile.js|"$EXPECTED_PAGE") ;;
              *) echo "Arquivo fora do escopo O3: $file"; exit 1 ;;
            esac
          done
          git add -- "${FILES[@]}"
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" -gt 0
          echo "Arquivos efetivamente staged:"
          printf ' - %s\n' "${STAGED[@]}"
          PREPARED_SORTED="$(printf '%s\n' "${FILES[@]}" | sort)"
          STAGED_SORTED="$(printf '%s\n' "${STAGED[@]}" | sort)"
          if [[ "$PREPARED_SORTED" != "$STAGED_SORTED" ]]; then
            echo "Diff staged diverge do conjunto preparado; recusando publicação."
            exit 1
          fi

      - name: Criar commit local antes dos gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pnm-o3-bot"
          git config user.email "pnm-o3-bot@users.noreply.github.com"
          git commit -m "O3: add product via Central transaction ${TRANSACTION_ID}"

      - name: Validar transação O3
        run: npm run test:o3-new-product-transaction

      - name: Executar gates oficiais completos
        run: npm run check

      - name: Limpar artefatos efêmeros dos gates
        run: git reset --hard HEAD

      - name: Publicar branch transacional
        shell: bash
        run: |
          set -euo pipefail
          git push --set-upstream origin "$O3_BRANCH"

      - name: Criar PR governada
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_ID="$(node -e "const p=JSON.parse(Buffer.from(process.env.PAYLOAD_B64,'base64').toString('utf8')); process.stdout.write(String(p.id||''))")"
          if ! gh pr create \
            --base main \
            --head "$O3_BRANCH" \
            --title "O3 — Novo Produto: ${PRODUCT_ID}" \
            --body "Transação criada pela Central protegida. Owner único preservado; derivados gerados pelo E2; CI obrigatório; merge automático permitido apenas após CI verde e validação estrita de escopo."; then
            echo "PR automática indisponível. Branch validada preservada em ${O3_BRANCH} para recuperação governada."
            exit 1
          fi
