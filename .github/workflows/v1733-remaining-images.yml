name: V17.3.3 Resolve Remaining Images

on:
  push:
    branches:
      - agent/v17-3-3-image-resolver-run
    paths:
      - tools/resolve_v1733_remaining.py
      - .github/workflows/v1733-remaining-images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Validate syntax
        run: python -m py_compile tools/resolve_v1733_remaining.py
      - name: Resolve remaining exact product photos
        run: python tools/resolve_v1733_remaining.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v1733-remaining-images
          path: remaining-images-v1733.json
          if-no-files-found: error
          retention-days: 7
