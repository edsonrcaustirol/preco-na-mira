name: Publicar Preço na Mira

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o catálogo
        uses: actions/checkout@v5

      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site
          unzip -q site-base.zip -d _site
          if [ -f data/produtos.js ]; then
            mkdir -p _site/data
            cp data/produtos.js _site/data/produtos.js
          elif compgen -G "data/produtos.part-*" > /dev/null; then
            mkdir -p _site/data
            node -e 'const fs=require("node:fs");const parts=fs.readdirSync("data").filter((name)=>name.startsWith("produtos.part-")).sort();fs.writeFileSync("_site/data/produtos.js",Buffer.concat(parts.map((name)=>fs.readFileSync(`data/${name}`))))'
          fi
          if [ -f data/experiencias.js ]; then
            mkdir -p _site/data
            cp data/experiencias.js _site/data/experiencias.js
          fi
          if [ -d assets ]; then
            mkdir -p _site/assets
            rsync -a assets/ _site/assets/
          fi
          for arquivo in ./*.html; do
            [ -f "$arquivo" ] || continue
            cp "$arquivo" _site/"$(basename "$arquivo")"
          done

          # V14.0: aplica a nova camada visual depois do CSS histórico do site.
          # Isso mantém compatibilidade com as páginas que ainda vivem dentro de site-base.zip.
          if [ -f _site/assets/site.css ]; then
            if [ -f _site/assets/kitchen-product-preview.css ]; then
              printf '\n/* Kitchen product preview — promoted to global layer */\n' >> _site/assets/site.css
              cat _site/assets/kitchen-product-preview.css >> _site/assets/site.css
            fi
            if [ -f _site/assets/v14-refinement.css ]; then
              printf '\n/* Preço na Mira V14.0 — refinement layer */\n' >> _site/assets/site.css
              cat _site/assets/v14-refinement.css >> _site/assets/site.css
            fi
          fi

          # Injeta a camada de interação V14 em todas as páginas públicas extraídas/atualizadas.
          node <<'NODE'
          const fs = require('node:fs');
          const dir = '_site';
          for (const name of fs.readdirSync(dir).filter((x) => x.endsWith('.html'))) {
            const path = `${dir}/${name}`;
            let html = fs.readFileSync(path, 'utf8');
            if (!html.includes('assets/v14-refinement.js')) {
              html = html.replace(/<\/body>/i, '<script src="assets/v14-refinement.js"></script></body>');
              fs.writeFileSync(path, html);
            }
          }
          NODE

          touch _site/.nojekyll

      - name: Preparar Google e outros buscadores
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'https://edsonrcaustirol.github.io/preco-na-mira/';
          const privatePages = new Set(['busca.html', 'favoritos.html', 'minha-lista.html']);

          for (const page of ['gerenciador.html', 'importador.html']) {
            fs.rmSync(`_site/${page}`, { force: true });
          }

          const htmlPages = fs.readdirSync('_site').filter((name) => name.endsWith('.html'));
          const publicPages = htmlPages.filter((name) => !privatePages.has(name));

          for (const page of publicPages) {
            const path = `_site/${page}`;
            let html = fs.readFileSync(path, 'utf8');
            if (/<meta\s+name=["']robots["']/i.test(html)) {
              html = html.replace(
                /<meta\s+name=["']robots["']\s+content=["'][^"']*["']\s*\/?\s*>/i,
                '<meta name="robots" content="index,follow">'
              );
            } else {
              html = html.replace(/<\/head>/i, '<meta name="robots" content="index,follow"></head>');
            }
            fs.writeFileSync(path, html);
          }

          fs.writeFileSync('_site/robots.txt', [
            'User-agent: *',
            'Allow: /',
            'Disallow: /preco-na-mira/gerenciador.html',
            'Disallow: /preco-na-mira/importador.html',
            'Disallow: /preco-na-mira/busca.html',
            'Disallow: /preco-na-mira/favoritos.html',
            'Disallow: /preco-na-mira/minha-lista.html',
            `Sitemap: ${base}sitemap.xml`,
            ''
          ].join('\n'));

          const products = fs.readFileSync('_site/data/produtos.js', 'utf8');
          const ids = [...products.matchAll(/\n\s+"id":\s+"([^"]+)"/g)].map((match) => match[1]);
          const urls = [
            ...publicPages.map((page) => page === 'index.html' ? base : `${base}${page}`),
            ...ids.map((id) => `${base}produto.html?id=${encodeURIComponent(id)}`)
          ];
          const sitemap = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...urls.map((url) => `  <url><loc>${url.replace(/&/g, '&amp;')}</loc></url>`),
            '</urlset>',
            ''
          ].join('\n');
          fs.writeFileSync('_site/sitemap.xml', sitemap);
          NODE

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar pacote do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
