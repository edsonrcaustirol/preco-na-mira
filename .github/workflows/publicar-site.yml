name: Validar e publicar Preco na Mira

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preco-na-mira-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar ferramentas travadas
        run: npm ci

      - name: Auditar e validar pacote do Cloudflare
        run: npm run check

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html
          test -f 404.html
          test -f montar-pc.html
          test -f assets/pnm-platform-v18.css
          test -f assets/pnm-platform-v18.js
          test -f assets/pnm-montar-pc-immersive.css
          test -f assets/pages/montar-pc-immersive.js
          test -f data/produtos-montar-pc.js

  publicar:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validar
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar ferramentas travadas
        run: npm ci

      - name: Regenerar dados publicados
        run: npm run build:mobile-data && npm run build:dewalt-queue

      - name: Auditoria final antes da producao
        run: npm run audit:strict

      - name: Publicar no Cloudflare Workers
        run: npm run deploy
