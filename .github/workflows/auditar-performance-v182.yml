name: Auditar Performance V18.2

on:
  push:
    branches:
      - spi-v18-2-performance-audit

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identificar Chrome
        run: |
          google-chrome --version || chromium --version || true

      - name: PageSpeed e Lighthouse — catálogo e ofertas
        shell: bash
        run: |
          set -uo pipefail
          for PAGE in catalogo ofertas; do
            URL="https://preconamira.com.br/$PAGE"
            echo "===== $PAGE ====="
            API="https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
            if curl --fail --silent --show-error --retry 2 --get "$API" \
              --data-urlencode "url=$URL" \
              --data "strategy=mobile" \
              --data "category=performance" \
              -o "psi-$PAGE.json"; then
              node - "$PAGE" <<'NODE'
const fs=require('fs');
const page=process.argv[2];
const r=JSON.parse(fs.readFileSync(`psi-${page}.json`,'utf8'));
const a=r.lighthouseResult?.audits||{};
const field=r.loadingExperience?.metrics||{};
const fmt=(v,d=0)=>typeof v==='number'?v.toFixed(d):'n/d';
console.log(`PSI ${page} mobile performance=${fmt((r.lighthouseResult?.categories?.performance?.score||0)*100)}`);
console.log(`PSI ${page} lab LCP=${fmt((a['largest-contentful-paint']?.numericValue||0)/1000,2)}s CLS=${fmt(a['cumulative-layout-shift']?.numericValue,3)} TBT=${fmt(a['total-blocking-time']?.numericValue)}ms`);
console.log(`PSI ${page} field LCP=${field.LARGEST_CONTENTFUL_PAINT_MS?.percentile??'n/d'}ms CLS=${field.CUMULATIVE_LAYOUT_SHIFT_SCORE?.percentile??'n/d'} INP=${field.INTERACTION_TO_NEXT_PAINT?.percentile??'n/d'}ms`);
NODE
            else
              echo "PSI $PAGE indisponível sem chave/quota; seguindo com Lighthouse local."
            fi

            npx --yes lighthouse@12.8.2 "$URL" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance \
              --output=json \
              --output-path="lh-$PAGE.json"
            node - "$PAGE" <<'NODE'
const fs=require('fs');
const page=process.argv[2];
const r=JSON.parse(fs.readFileSync(`lh-${page}.json`,'utf8'));
const a=r.audits||{};
const fmt=(v,d=0)=>typeof v==='number'?v.toFixed(d):'n/d';
console.log(`LH ${page} performance=${fmt((r.categories?.performance?.score||0)*100)}`);
console.log(`LH ${page} LCP=${fmt((a['largest-contentful-paint']?.numericValue||0)/1000,2)}s CLS=${fmt(a['cumulative-layout-shift']?.numericValue,3)} TBT=${fmt(a['total-blocking-time']?.numericValue)}ms FCP=${fmt((a['first-contentful-paint']?.numericValue||0)/1000,2)}s`);
NODE
          done
