name: V17.3.3 Resolve Product Images

on:
  push:
    branches:
      - agent/v17-3-3-image-resolver-run
    paths:
      - tools/resolve_v1733_images.py
      - .github/workflows/v1733-image-resolver.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fix runner copy and validate syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/resolve_v1733_images.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if "if n%20==0 or x['status']=='failed':print(" in line:
                  lines[i]="            if n%20==0 or x['status']=='failed': print('[%d/%d] %s #%d %s' % (n,len(TARGETS),x['status'],x['index'],x['method']),flush=True)"
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python -m py_compile tools/resolve_v1733_images.py

      - name: Resolve real product images
        run: |
          if [ ! -f resolved-images-v1733.json ]; then
            python tools/resolve_v1733_images.py
          else
            echo "Mapa já existe; preservando resolução anterior."
          fi

      - name: Build compact transfer map
        run: |
          python - <<'PY'
          import base64,gzip,json,textwrap
          src=json.load(open('resolved-images-v1733.json',encoding='utf-8'))
          rows=[[x['index'],x.get('image',''),x.get('method',''),x.get('source','')] for x in src['results']]
          raw=json.dumps(rows,separators=(',',':'),ensure_ascii=False).encode()
          b64=base64.b64encode(gzip.compress(raw,9)).decode()
          open('resolved-images-v1733.min.b64','w').write('\n'.join(textwrap.wrap(b64,4000))+'\n')
          print('compact bytes',len(b64),'lines',len(textwrap.wrap(b64,4000)),'resolved',src['resolved'],'failed',src['failed'])
          PY

      - name: Commit resolution map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f resolved-images-v1733.json resolved-images-v1733.csv resolved-images-v1733.min.b64
          git diff --cached --quiet && exit 0
          git commit -m "Fragmenta mapa compacto de fotos V17.3.3"
          git push
