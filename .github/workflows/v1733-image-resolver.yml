name: V17.3.3 Resolve Product Images

on:
  push:
    branches:
      - agent/v17-3-3-image-resolver-run
    paths:
      - tools/resolve_v1733_images.py
      - .github/workflows/v1733-image-resolver.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve real product images
        run: python tools/resolve_v1733_images.py

      - name: Commit resolution map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resolved-images-v1733.json resolved-images-v1733.csv
          git diff --cached --quiet && exit 0
          git commit -m "Resolve fotos reais da V17.3.3"
          git push
