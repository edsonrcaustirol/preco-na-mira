name: O4-R3 diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Build site
        run: npm run build:site
      - name: Site strict audit
        run: node scripts/auditar-site.mjs --strict
      - name: SEO P9 audit
        run: node scripts/auditar-seo-p9.mjs
      - name: Public Worker dry run
        run: npx wrangler deploy --dry-run
      - name: Central Worker dry run
        run: npx wrangler deploy --dry-run --config central/wrangler.jsonc
