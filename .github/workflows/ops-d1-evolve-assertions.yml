name: Ops D1 evolve assertions

on:
  push:
    branches: [d1-central-remote-provision]

permissions:
  contents: write

jobs:
  evolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d1-central-remote-provision
      - name: Evolve only stale D1 absence assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'scripts/test-l2-4a-central-products.mjs',
              'scripts/test-l2-4b-central-link-health.mjs',
              'scripts/test-l2-4c-affiliate-executor.mjs',
              'scripts/test-l2-4d-operational-history.mjs',
              'scripts/test-l2-4e-health-history.mjs',
              'scripts/test-l2-4g-central-operational.mjs',
              'scripts/test-l2-4h-new-product.mjs',
          ]
          pattern = re.compile(r"^(?P<i>\s*)assert\.equal\('d1_databases' in (?P<v>[A-Za-z_$][\w$]*), false(?:,\s*[^;]+)?\);$", re.M)
          changed = 0
          for name in files:
              path = Path(name)
              source = path.read_text()
              def repl(match):
                  global changed
                  changed += 1
                  indent, var = match.group('i'), match.group('v')
                  return (
                      f"{indent}assert.equal(Array.isArray({var}.d1_databases), true, 'D1 operacional deve estar declarado');\n"
                      f"{indent}assert.equal({var}.d1_databases.some(entry => entry?.binding === 'PNM_HISTORY_DB'), true, 'binding PNM_HISTORY_DB ausente');"
                  )
              updated = pattern.sub(repl, source)
              path.write_text(updated)
          if changed != 7:
              raise SystemExit(f'expected 7 stale assertions, changed {changed}')
          print(f'changed={changed}')
          PY
          git diff --check
          git diff -- scripts/test-l2-4*.mjs
      - name: Commit evolved assertions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-l2-4*.mjs
          git commit -m 'test: evolve L2 expectations for operational D1'
          git push origin HEAD:d1-central-remote-provision
