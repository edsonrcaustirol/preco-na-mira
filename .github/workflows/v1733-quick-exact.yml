name: V17.3.3 Quick Exact Images

on:
  push:
    branches:
      - agent/v17-3-3-image-resolver-run
    paths:
      - tools/resolve_v1733_quick_exact.py
      - .github/workflows/v1733-quick-exact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: python tools/resolve_v1733_quick_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: v1733-quick-exact
          path: quick-exact-v1733.json
          if-no-files-found: error
          retention-days: 7
