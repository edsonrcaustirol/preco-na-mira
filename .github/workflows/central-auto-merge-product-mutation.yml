name: Central Auto Merge Product Mutation

on:
  workflow_run:
    workflows:
      - Validar Preco na Mira
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: central-auto-merge-product-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge-product-mutation:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validar escopo e publicar mutação
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const branch = run.head_branch || '';
            if (!branch.startsWith('central/product-mutation-pm-')) {
              core.info('Run não pertence a mutação de produto da Central.');
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 100,
            });
            if (!pulls.length) {
              core.info(`Nenhuma PR aberta encontrada para ${branch}.`);
              return;
            }
            const pr = pulls[0];
            if (pr.base.ref !== 'main' || pr.head.sha !== run.head_sha) {
              core.setFailed(`PR #${pr.number} não corresponde exatamente ao SHA validado.`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const names = files.map(f => f.filename).sort();
            const productPages = names.filter(n => /^produto-[a-z0-9][a-z0-9-]*\.html$/.test(n));
            const exactScope = names.length === 3
              && names.includes('data/produtos-index.js')
              && names.includes('data/produtos-mobile.js')
              && productPages.length === 1;
            if (!exactScope) {
              core.setFailed(`Escopo recusado: ${names.join(', ')}`);
              return;
            }
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              sha: pr.head.sha,
              merge_method: 'merge',
              commit_title: `Merge PR #${pr.number} — gerenciar produto pela Central`,
              commit_message: 'CI aprovado e escopo transacional de produto validado automaticamente.',
            });
            if (!result.data.merged) core.setFailed(result.data.message || 'Merge recusado pelo GitHub.');
