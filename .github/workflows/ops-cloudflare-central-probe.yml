name: Ops Cloudflare Central Probe

on:
  push:
    branches:
      - ops-cloudflare-central-finalize-20260831

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_CF_ACCOUNT_ID_SECRET: ${{ secrets.CF_ACCOUNT_ID != '' }}
      HAS_CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_CF_ACCOUNT_ID_VAR: ${{ vars.CF_ACCOUNT_ID != '' }}
    steps:
      - name: Report Cloudflare credential availability safely
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_API_TOKEN=${HAS_CLOUDFLARE_API_TOKEN}"
          echo "CF_API_TOKEN=${HAS_CF_API_TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID(secret)=${HAS_CLOUDFLARE_ACCOUNT_ID_SECRET}"
          echo "CF_ACCOUNT_ID(secret)=${HAS_CF_ACCOUNT_ID_SECRET}"
          echo "CLOUDFLARE_ACCOUNT_ID(var)=${HAS_CLOUDFLARE_ACCOUNT_ID_VAR}"
          echo "CF_ACCOUNT_ID(var)=${HAS_CF_ACCOUNT_ID_VAR}"
