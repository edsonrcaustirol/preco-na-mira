name: V17.3.3 Official Image Pass

on:
  push:
    branches:
      - agent/v17-3-3-image-resolver-run
    paths:
      - tools/resolve_v1733_official_fast.py
      - .github/workflows/v1733-official-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - run: python -m py_compile tools/resolve_v1733_official_fast.py
      - run: python tools/resolve_v1733_official_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: v1733-official-fast
          path: official-fast-v1733.json
          if-no-files-found: error
          retention-days: 7
