name: Ops D1 stale assertions

on:
  push:
    branches: [d1-central-remote-provision]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find stale D1/entrypoint assertions
        run: |
          set -euo pipefail
          echo '--- d1_databases assertions ---'
          grep -RIn --include='*.mjs' "d1_databases" scripts || true
          echo '--- Central entrypoint assertions ---'
          grep -RIn --include='*.mjs' "github-oauth-worker.mjs" scripts || true
          echo '--- D1 absent wording ---'
          grep -RIn --include='*.mjs' -E "D1.*(ausente|fora|não.*provision|nao.*provision)" scripts || true
